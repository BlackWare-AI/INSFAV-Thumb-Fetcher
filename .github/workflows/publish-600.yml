name: Publish Thumb Fetcher 6.0.0
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/instagram-session.yml
  publish:
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Require the existing signing key
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then echo "Missing required existing signing secret: $name" >&2; exit 1; fi
          done
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/session-release.jks"
          test -s "$RUNNER_TEMP/session-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/session-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release
        shell: bash
        run: |
          if ! ./gradlew :app:lintRelease :app:assembleRelease --no-daemon --console=plain > "$RUNNER_TEMP/signing-build.log" 2>&1; then
            echo 'Release build or lint failed; signing output withheld to protect existing key material.' >&2
            exit 1
          fi
      - name: Verify package, version and signing certificate continuity
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/aapt2" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
          grep -F "package: name='com.insfav.thumbfetcher' versionCode='13' versionName='6.0.0'" "$RUNNER_TEMP/badging.txt"
          if grep -q application-debuggable "$RUNNER_TEMP/badging.txt"; then exit 1; fi
          "$tools/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/current-cert.txt"
          mkdir previous
          gh release download v0.5.0-build12 --pattern '*.apk' --dir previous
          prior=$(find previous -name '*.apk' -print -quit)
          "$tools/apksigner" verify --verbose --print-certs "$prior" > "$RUNNER_TEMP/previous-cert.txt"
          grep 'certificate SHA-256 digest:' "$RUNNER_TEMP/current-cert.txt" > current-cert.txt
          grep 'certificate SHA-256 digest:' "$RUNNER_TEMP/previous-cert.txt" > previous-cert.txt
          diff -u previous-cert.txt current-cert.txt
          cp "$apk" INSFAV-Thumb-Fetcher-6.0.0.apk
          sha256sum INSFAV-Thumb-Fetcher-6.0.0.apk > SHA256SUMS
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch the signed release APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tools/release-smoke.sh
      - name: Publish only the verified session update
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          if gh release view v6.0.0 >/dev/null 2>&1; then echo 'Release already exists; refusing to overwrite.'; exit 1; fi
          gh release create v6.0.0 INSFAV-Thumb-Fetcher-6.0.0.apk SHA256SUMS --target "$GITHUB_SHA" --title 'INSFAV Thumb Fetcher 6.0.0' --notes-file RELEASE-6.0.0.md
      - name: Remove temporary signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/session-release.jks"
