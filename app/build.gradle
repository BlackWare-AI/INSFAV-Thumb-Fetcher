plugins { id 'com.android.application' }
android {
    namespace 'com.insfav.thumbfetcher'
    compileSdk 35
    defaultConfig {
        applicationId 'com.insfav.thumbfetcher'
        minSdk 26
        targetSdk 37
        versionCode 10
        versionName '0.5.0'
        testInstrumentationRunner 'com.insfav.thumbfetcher.PoolInstrumentation'
    }
    signingConfigs {
        release {
            def signingPath = System.getenv('ANDROID_KEYSTORE_PATH')
            if (signingPath != null && !signingPath.isEmpty()) storeFile file(signingPath)
            storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: ''
            keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: ''
            keyPassword System.getenv('ANDROID_KEY_PASSWORD') ?: ''
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests.includeAndroidResources = true }
}
dependencies {
    implementation 'androidx.work:work-runtime:2.10.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
